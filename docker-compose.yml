services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: newtonite
    ports: ["5432:5432"]            # exposed so `npm test` can reach it from your machine
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newtonite"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:                               # runs migrations + seed (idempotent), then serves API and UI
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/newtonite
      JWT_SECRET: ${JWT_SECRET:-change-me-in-real-deployments}
      SEED_ITEMS: ${SEED_ITEMS:-5000}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:                            # background job processor (outbox consumer)
    build: .
    command: ["node", "src/worker.js"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/newtonite
    depends_on:
      api: { condition: service_healthy }   # api has finished migrating

volumes:
  pgdata:
